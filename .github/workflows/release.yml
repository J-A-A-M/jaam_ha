name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.2.0)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - production
          - beta
        default: production

run-name: Release ${{ inputs.version }} (${{ inputs.release_type }})

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format. Expected: X.Y.Z"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if version already exists
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Error: Version ${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Update version in manifest.json
        run: |
          python3 << 'EOF'
          import json

          manifest_path = "custom_components/jaam_ha/manifest.json"

          with open(manifest_path, 'r') as f:
              manifest = json.load(f)

          old_version = manifest.get('version', '')
          new_version = "${{ inputs.version }}"

          if old_version == new_version:
              print(f"⚠️ Warning: Version is already {new_version}")
          else:
              print(f"Updating version: {old_version} -> {new_version}")

          manifest['version'] = new_version

          with open(manifest_path, 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')  # Add trailing newline

          print(f"✅ Version updated to {new_version}")
          EOF

      - name: Verify version in manifest.json
        run: |
          python3 << 'EOF'
          import json
          import sys

          manifest_path = "custom_components/jaam_ha/manifest.json"

          with open(manifest_path, 'r') as f:
              manifest = json.load(f)

          current_version = manifest.get('version', '')
          expected_version = "${{ inputs.version }}"

          if current_version != expected_version:
              print(f"❌ Error: Version mismatch!")
              print(f"Expected: {expected_version}")
              print(f"Actual: {current_version}")
              sys.exit(1)

          print(f"✅ Version verified: {current_version}")
          EOF

      - name: Generate changelog with AI
        id: changelog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          VERSION="${{ inputs.version }}"
          RELEASE_TYPE="${{ inputs.release_type }}"

          # Отримуємо попередній тег (останній beta або release)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%an, %h)" HEAD | head -30)
          else
            COMMITS=$(git log --pretty=format:"- %s (%an, %h)" ${PREVIOUS_TAG}..HEAD)
          fi

          echo "📝 Генеруємо changelog за допомогою AI..."

          # Викликаємо Gemini API
          if [ -n "$GEMINI_API_KEY" ]; then
            # Визначаємо тип релізу для промпту
            if [ "$RELEASE_TYPE" = "beta" ]; then
              RELEASE_HEADER="# 🧪 Beta Реліз ${VERSION}"
              RELEASE_WARNING="> ⚠️ **Увага**: Це бета-версія для тестування. Може містити нестабільні функції."
            else
              RELEASE_HEADER="# 🎉 Реліз ${VERSION}"
              RELEASE_WARNING=""
            fi

            # Створюємо промпт для AI
            PROMPT="Ти - AI асистент для створення changelog для Home Assistant інтеграції \"JAAM HA\".

            Проаналізуй наступні коміти та створи професійний changelog українською мовою у форматі Markdown.

            ВАЖЛИВО - ФОРМАТ ВИВОДУ:
            - Виводь ТІЛЬКИ markdown контент changelog
            - НЕ додавай жодних вступних фраз або пояснень
            - Почни відразу з заголовку (${RELEASE_HEADER})
            - НЕ пиши \"Ось оновлений список\", \"Ось changelog\" або подібне

            ВАЖЛИВО: Ігноруй технічні коміти, які не впливають на функціональність інтеграції:
            - Зміни в GitHub Actions (.github/workflows)
            - Зміни конфігурації білда (якщо вони не додають нові функції користувачам)
            - Оновлення документації проекту
            - Зміни в CI/CD
            - Рефакторинг без нових функцій

            Включай тільки зміни, які впливають на роботу інтеграції або додають нові можливості користувачам.

            Коміти:
            ${COMMITS}

            Створи changelog ТОЧНО з такою структурою:

            ${RELEASE_HEADER}

            ${RELEASE_WARNING}

            ## Що нового

            [Згрупуй зміни за категоріями. Використовуй емоджі:]
            - 🚀 Нові можливості
            - 🐛 Виправлення помилок
            - 🔧 Технічні покращення
            - ⚡ Оптимізація
            - 🎨 UI/UX покращення

            Вимоги:
            - Будь стислим та зрозумілим для кінцевих користувачів
            - Опиши зміни простою мовою, уникай технічного жаргону де можливо
            - Якщо коміт технічний (refactor, cleanup) - опиши користувацьку вигоду
            - Групуй схожі зміни разом
            - Підкресли найважливіші зміни
            - НЕ додавай секції про завантаження або встановлення

            ВИВОДЬ ТІЛЬКИ MARKDOWN БЕЗ ВСТУПНИХ ФРАЗ!"

            # Створюємо JSON payload
            JSON_PAYLOAD=$(jq -n \
              --arg prompt "$PROMPT" \
              '{
                "contents": [{
                  "parts": [{
                    "text": $prompt
                  }]
                }],
                "generationConfig": {
                  "temperature": 0.7,
                  "maxOutputTokens": 2048
                }
              }')

            RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD")

            # Перевіряємо чи є помилка в відповіді
            ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
            if [ -n "$ERROR" ]; then
              echo "⚠️ Помилка API: $ERROR"
              echo "📄 Повна відповідь:"
              echo "$RESPONSE" | jq .
            fi

            # Витягуємо текст з відповіді
            CHANGELOG=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

            if [ -z "$CHANGELOG" ]; then
              echo "⚠️ AI не згенерував changelog, використовуємо fallback"
              if [ "$RELEASE_TYPE" = "beta" ]; then
                CHANGELOG="# 🧪 Beta Реліз ${VERSION}

              > ⚠️ **Увага**: Це бета-версія для тестування. Може містити нестабільні функції.

              ## Що нового

              ${COMMITS}"
              else
                CHANGELOG="# 🎉 Реліз ${VERSION}

              ## Що нового

              ${COMMITS}"
              fi
            else
              echo "✅ AI згенерував changelog"

              # Видаляємо всі рядки до першого рядка, що починається з # (markdown заголовок)
              # Це видаляє зайві вступні фрази типу "Ось оновлений список змін"
              CHANGELOG=$(echo "$CHANGELOG" | sed -n '/^#/,$p')
            fi
          else
            echo "⚠️ GEMINI_API_KEY не знайдено, використовуємо стандартний changelog"
            if [ "$RELEASE_TYPE" = "beta" ]; then
              CHANGELOG="# 🧪 Beta Реліз ${VERSION}

              > ⚠️ **Увага**: Це бета-версія для тестування. Може містити нестабільні функції.

              ## Що нового

              ${COMMITS}"
            else
              CHANGELOG="# 🎉 Реліз ${VERSION}

              ## Що нового

              ${COMMITS}"
            fi
          fi

          # Зберігаємо changelog
          echo "$CHANGELOG" > changelog.md
          echo ""
          echo "=== Generated Changelog ==="
          cat changelog.md
          echo "==========================="

      - name: Commit version update
        run: |
          git add custom_components/jaam_ha/manifest.json
          git commit -m "chore: bump version to ${{ inputs.version }}"

      - name: Create and push tag
        run: |
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin main
          git push origin "${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_type == 'beta' && format('Beta {0}', inputs.version) || inputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ inputs.release_type == 'beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: success()
        run: |
          if [ "${{ inputs.release_type }}" = "beta" ]; then
            echo "### ✅ Beta Реліз Створено!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Реліз Створено!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Версія**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Тег**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Тип релізу**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Переглянути реліз](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📋 Changelog" >> $GITHUB_STEP_SUMMARY
          cat changelog.md >> $GITHUB_STEP_SUMMARY
